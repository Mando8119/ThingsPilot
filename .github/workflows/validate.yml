name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: ./tools/Validate.ps1 -Dotnet dotnet
      - run: ./tools/Preview.ps1 -SkipBuild
      - name: Verify preview installer payload
        shell: pwsh
        run: |
          $preview = Get-ChildItem artifacts -Directory -Filter preview-x64-* | Select-Object -First 1
          & "$($preview.FullName)/Install.ps1" -CheckOnly
      - uses: actions/upload-artifact@v4
        with:
          name: thingpilot-preview
          retention-days: 7
          path: |
            artifacts/*.zip
            artifacts/PREVIEW-SHA256SUMS.txt
